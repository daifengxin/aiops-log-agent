[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-log-agent"
version = "0.1.0"
description = "Evaluation-first AI ops log anomaly detection agent"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.23",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.60",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.0.0",
    "tabulate>=0.9.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
aiops-agent = "aiops_agent.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
